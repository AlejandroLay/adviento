<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<style id="gate-style">
:root{--bg:#F5F4F0;--ink:#1E2A24;--soft:#67716B;--line:#E0DCD3;--paper:#FFFFFF;--accent:#7A1E2C;--gold:#B08D57;color-scheme:light}
@media (prefers-color-scheme: dark){:root{--bg:#0F1613;--ink:#EEE9DF;--soft:#9AA39D;--line:#26312B;--paper:#151E1A;--accent:#D87A88;--gold:#CFAE78;color-scheme:dark}}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Jost","Futura",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.gate{min-height:100%;display:grid;place-items:center;padding:32px max(20px, env(safe-area-inset-left, 0px)) 32px max(20px, env(safe-area-inset-right, 0px));box-sizing:border-box}
.card{width:min(360px,100%);display:grid;gap:18px;justify-items:center;text-align:center;animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
.mark{width:44px;height:58px}
.mark path{fill:none;stroke:var(--ink);stroke-width:1.1}
.mark .in{stroke:var(--gold);stroke-width:.8}
.mark circle{fill:var(--gold)}
.eyebrow{margin:0;font-size:.68rem;letter-spacing:.32em;text-transform:uppercase;color:var(--soft);font-weight:500}
h1{margin:0;font-family:"Bodoni Moda","Didot",Georgia,serif;font-weight:400;font-size:2.4rem;line-height:1;letter-spacing:-.01em}
h1 em{color:var(--accent)}
.panel{width:100%;display:grid;gap:12px;margin-top:10px;justify-items:stretch}
label.pw{font-size:.62rem;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);font-weight:600;justify-self:start}
input[type=password]{width:100%;box-sizing:border-box;font:inherit;font-size:1.05rem;padding:13px 18px;border:1px solid var(--line);border-radius:999px;background:var(--paper);color:var(--ink);outline:none;text-align:center;letter-spacing:.08em}
input[type=password]:focus{border-color:var(--gold)}
.rem{display:flex;align-items:center;justify-content:center;gap:8px;font-size:.82rem;color:var(--soft);font-weight:300;cursor:pointer}
.rem input{accent-color:var(--gold)}
button{font:inherit;font-weight:500;font-size:.74rem;letter-spacing:.2em;text-transform:uppercase;padding:13px 24px;border-radius:999px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);cursor:pointer}
button[disabled]{opacity:.5;cursor:default}
button.link{background:none;border:0;color:var(--soft);font-size:.8rem;letter-spacing:.02em;text-transform:none;font-weight:300;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:4px;padding:6px}
.bio-btn{display:flex;align-items:center;justify-content:center;gap:12px;padding:16px 24px}
.bio-btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round}
.q{margin:0;font-family:"Bodoni Moda",Georgia,serif;font-size:1.25rem;line-height:1.35}
.sub{margin:-4px 0 4px;font-size:.84rem;color:var(--soft);font-weight:300}
.msg{min-height:1.4em;margin:0;font-family:"Bodoni Moda",Georgia,serif;font-style:italic;color:var(--accent)}
:focus-visible{outline:1.5px solid var(--gold);outline-offset:3px}
.checking .card{visibility:hidden}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.card{animation:none}}
</style>
</head>
<body>
<main class="gate checking" id="gate">
  <div class="card">
    <svg class="mark" viewBox="0 0 26 34" aria-hidden="true"><path d="M13 .6C19.8.6 25.4 6.2 25.4 13V33.4H.6V13C.6 6.2 6.2.6 13 .6Z"/><path class="in" d="M13 4.6C17.6 4.6 21.4 8.4 21.4 13V29.4H4.6V13C4.6 8.4 8.4 4.6 13 4.6Z"/><circle cx="18" cy="20" r="1.4"/></svg>
    <p class="eyebrow">Diciembre · MMXXVI</p>
    <h1>Adviento <em>de Lauri</em></h1>

    <div class="panel" id="bio" hidden>
      <button type="button" class="bio-btn" id="bioGo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 11v3.5a6 6 0 0 1-1.5 4"/><path d="M8.5 11.5a3.5 3.5 0 0 1 7 0v2a10 10 0 0 1-1 4.5"/><path d="M6 13v-1.5a6 6 0 0 1 12 0V13a12 12 0 0 1-.6 3.8"/><path d="M4.2 15.5A9 9 0 0 1 4 13.5V11.5a8 8 0 0 1 13.5-5.8"/><path d="M19.7 9a8 8 0 0 1 .3 2.5v2"/></svg>Entrar con huella</button>
      <p class="msg" id="bmsg" role="status" aria-live="polite"></p>
      <button type="button" class="link" id="usePw">Usar la contraseña</button>
    </div>

    <form class="panel" id="f" autocomplete="on" hidden>
      <label class="pw" for="pw">Contraseña</label>
      <input id="pw" name="password" type="password" autocomplete="current-password" required>
      <label class="rem"><input type="checkbox" id="rem" checked> Recordarme en este dispositivo</label>
      <button type="submit" id="go">Entrar</button>
      <p class="msg" id="msg" role="status" aria-live="polite"></p>
    </form>

    <div class="panel" id="enroll" hidden>
      <p class="q">¿Quieres entrar con tu huella la próxima vez?</p>
      <p class="sub">Tu huella no sale del móvil. Solo sirve para abrir el calendario.</p>
      <button type="button" class="bio-btn" id="bioYes"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 11v3.5a6 6 0 0 1-1.5 4"/><path d="M8.5 11.5a3.5 3.5 0 0 1 7 0v2a10 10 0 0 1-1 4.5"/><path d="M6 13v-1.5a6 6 0 0 1 12 0V13a12 12 0 0 1-.6 3.8"/><path d="M4.2 15.5A9 9 0 0 1 4 13.5V11.5a8 8 0 0 1 13.5-5.8"/><path d="M19.7 9a8 8 0 0 1 .3 2.5v2"/></svg>Activar huella</button>
      <button type="button" class="link" id="bioNo">Ahora no</button>
      <p class="msg" id="emsg" role="status" aria-live="polite"></p>
    </div>
  </div>
</main>

  const tob64 = u => { let s = ''; u.forEach(b => { s += String.fromCharCode(b); }); return btoa(s); };
  const rnd = n => crypto.getRandomValues(new Uint8Array(n));
  const open = async (key, bytes) => S.decrypt({ name: 'AES-GCM', iv: bytes.slice(0, 12) }, key, bytes.slice(12));
  const unlock = async key => JSON.parse(new TextDecoder().decode(await open(key, unb64(D.p))));
  const derive = async p => S.deriveKey(
    { name: 'PBKDF2', salt: unb64(D.s), iterations: D.i, hash: 'SHA-256' },
    await S.importKey('raw', new TextEncoder().encode(p), 'PBKDF2', false, ['deriveKey']),
    { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
  const show = id => ['bio', 'f', 'enroll'].forEach(p => { $(p).hidden = p !== id; });

  const boot = (key, app) => {
    const cache = new Map();
    window.__PROD = true;
    window.__asset = p => {
      const m = app.assets[p];
      if (!m) return Promise.resolve(p);
      if (!cache.has(p)) cache.set(p, fetch(m.f)
        .then(r => { if (!r.ok) throw new Error('missing'); return r.arrayBuffer(); })
        .then(b => open(key, new Uint8Array(b)))
        .then(pt => URL.createObjectURL(new Blob([pt], { type: m.t })))
        .catch(() => p));
      return cache.get(p);
    };
    $('gate-style').remove();
    gate.remove();
    const tpl = document.createElement('template');
    tpl.innerHTML = app.html;
    const scripts = [...tpl.content.querySelectorAll('script')];
    scripts.forEach(s => s.remove());
    document.body.prepend(tpl.content);
    scripts.forEach(s => { const n = document.createElement('script'); n.textContent = s.textContent; document.body.appendChild(n); });
  };

  /* ---------- fingerprint (WebAuthn passkey + PRF) ----------
     The calendar key is wrapped with a secret that only the phone's authenticator can produce,
     and only after the fingerprint check. Nothing biometric ever reaches this page. */
  const canBio = async () => {
    try { return !!(window.PublicKeyCredential && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()); }
    catch (e) { return false; }
  };
  const prfFrom = cred => { const r = cred.getClientExtensionResults().prf; return r && r.results && r.results.first; };
  const assert = (id, salt) => navigator.credentials.get({ publicKey: {
    challenge: rnd(32), rpId: location.hostname, userVerification: 'required', timeout: 60000,
    allowCredentials: [{ type: 'public-key', id }], extensions: { prf: { eval: { first: salt } } } } });
  const wrapKey = first => S.importKey('raw', first, 'AES-GCM', false, ['encrypt', 'decrypt']);

  async function bioEnroll(key) {
    const salt = rnd(32);
    const cred = await navigator.credentials.create({ publicKey: {
      rp: { name: 'Adviento de Lauri', id: location.hostname },
      user: { id: rnd(16), name: 'Lauri', displayName: 'Lauri' },
      challenge: rnd(32),
      pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
      authenticatorSelection: { authenticatorAttachment: 'platform', residentKey: 'preferred', userVerification: 'required' },
      timeout: 60000, extensions: { prf: { eval: { first: salt } } } } });
    const ext = cred.getClientExtensionResults().prf;
    if (!ext || (!ext.enabled && !(ext.results && ext.results.first))) throw new Error('noprf');
    let first = prfFrom(cred);
    if (!first) first = prfFrom(await assert(cred.rawId, salt));
    if (!first) throw new Error('noprf');
    const iv = rnd(12), raw = new Uint8Array(await S.exportKey('raw', key));
    const w = new Uint8Array(await S.encrypt({ name: 'AES-GCM', iv }, await wrapKey(first), raw));
    ls.set(BIO, JSON.stringify({ id: tob64(new Uint8Array(cred.rawId)), salt: tob64(salt), iv: tob64(iv), w: tob64(w) }));
    ls.del(KEY);
  }
  async function bioUnlock() {
    const b = JSON.parse(ls.get(BIO));
    const first = prfFrom(await assert(unb64(b.id), unb64(b.salt)));
    if (!first) throw new Error('noprf');
    const raw = await S.decrypt({ name: 'AES-GCM', iv: unb64(b.iv) }, await wrapKey(first), unb64(b.w));
    return S.importKey('raw', raw, 'AES-GCM', true, ['decrypt']);
  }

  const remember = async key => { if (rem.checked) ls.set(KEY, tob64(new Uint8Array(await S.exportKey('raw', key)))); };

  if (!window.isSecureContext || !S) { gate.classList.remove('checking'); show('f'); msg.textContent = 'Abre esta página con https.'; return; }

  // 1. Fingerprint set up on this device
  if (ls.get(BIO)) {
    gate.classList.remove('checking'); show('bio');
    const tryBio = async () => {
      const b = $('bioGo'); b.disabled = true; $('bmsg').textContent = '';
      try { const key = await bioUnlock(); boot(key, await unlock(key)); }
      catch (e) { b.disabled = false; $('bmsg').textContent = 'No se ha podido leer la huella. Prueba otra vez o usa la contraseña.'; }
    };
    $('bioGo').addEventListener('click', tryBio);
    $('usePw').addEventListener('click', () => { show('f'); pw.focus(); });
  } else {
    // 2. Remembered on this device without fingerprint
    try {
      const saved = ls.get(KEY);
      if (saved) {
        const key = await S.importKey('raw', unb64(saved), 'AES-GCM', true, ['decrypt']);
        return boot(key, await unlock(key));
      }
    } catch (e) { ls.del(KEY); }
    // 3. Password
    gate.classList.remove('checking'); show('f'); pw.focus();
  }

  let fails = 0;
  f.addEventListener('submit', async e => {
    e.preventDefault();
    if (go.disabled) return;
    go.disabled = true; msg.textContent = 'Abriendo…';
    let key, app;
    try { key = await derive(pw.value); app = await unlock(key); }
    catch (err) {
      fails++;
      const wait = Math.min(60, 2 ** fails);
      pw.value = '';
      msg.textContent = `Contraseña incorrecta. Espera ${wait} s.`;
      setTimeout(() => { go.disabled = false; msg.textContent = 'Contraseña incorrecta.'; pw.focus(); }, wait * 1000);
      return;
    }
    if (!ls.get(BIO) && !ls.get(SKIP) && await canBio()) {
      show('enroll');
      $('bioYes').addEventListener('click', async () => {
        $('bioYes').disabled = true; $('emsg').textContent = '';
        try { await bioEnroll(key); $('emsg').textContent = 'Huella activada.'; setTimeout(() => boot(key, app), 700); }
        catch (err) {
          $('bioYes').disabled = false;
          $('emsg').textContent = err && err.message === 'noprf'
            ? 'Este navegador no permite usar la huella aquí. Te recordaré en este dispositivo.'
            : 'No se ha podido activar. Prueba otra vez o pulsa «Ahora no».';
          if (err && err.message === 'noprf') { ls.set(SKIP, '1'); await remember(key); setTimeout(() => boot(key, app), 1800); }
        }
      });
      $('bioNo').addEventListener('click', async () => { ls.set(SKIP, '1'); await remember(key); boot(key, app); });
      return;
    }
    await remember(key);
    boot(key, app);
  });
})();
</script>
</body>
</html>
