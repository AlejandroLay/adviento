<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}

<style id="gate-style">
:root{--bg:#F5F4F0;--ink:#1E2A24;--soft:#67716B;--line:#E0DCD3;--paper:#FFFFFF;--accent:#7A1E2C;--gold:#B08D57;color-scheme:light}
@media (prefers-color-scheme: dark){:root{--bg:#0F1613;--ink:#EEE9DF;--soft:#9AA39D;--line:#26312B;--paper:#151E1A;--accent:#D87A88;--gold:#CFAE78;color-scheme:dark}}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Jost","Futura",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.gate{min-height:100%;display:grid;place-items:center;padding:32px max(20px, env(safe-area-inset-left, 0px)) 32px max(20px, env(safe-area-inset-right, 0px));box-sizing:border-box}
.card{width:min(360px,100%);display:grid;gap:18px;justify-items:center;text-align:center;animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
.mark{width:44px;height:58px}
.mark path{fill:none;stroke:var(--ink);stroke-width:1.1}
.mark .in{stroke:var(--gold);stroke-width:.8}
.mark circle{fill:var(--gold)}
.eyebrow{margin:0;font-size:.68rem;letter-spacing:.32em;text-transform:uppercase;color:var(--soft);font-weight:500}
h1{margin:0;font-family:"Bodoni Moda","Didot",Georgia,serif;font-weight:400;font-size:2.4rem;line-height:1;letter-spacing:-.01em}
h1 em{color:var(--accent)}
form{width:100%;display:grid;gap:12px;margin-top:10px}
label.pw{font-size:.62rem;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);font-weight:600;justify-self:start}
input[type=password]{width:100%;box-sizing:border-box;font:inherit;font-size:1.05rem;padding:13px 18px;border:1px solid var(--line);border-radius:999px;background:var(--paper);color:var(--ink);outline:none;text-align:center;letter-spacing:.08em}
input[type=password]:focus{border-color:var(--gold)}
.rem{display:flex;align-items:center;justify-content:center;gap:8px;font-size:.82rem;color:var(--soft);font-weight:300;cursor:pointer}
.rem input{accent-color:var(--gold)}
button{font:inherit;font-weight:500;font-size:.74rem;letter-spacing:.2em;text-transform:uppercase;padding:13px 24px;border-radius:999px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);cursor:pointer}
button[disabled]{opacity:.5;cursor:default}
.msg{min-height:1.4em;margin:0;font-family:"Bodoni Moda",Georgia,serif;font-style:italic;color:var(--accent)}
:focus-visible{outline:1.5px solid var(--gold);outline-offset:3px}
.checking .card{visibility:hidden}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.card{animation:none}}
</style>
</head>

        rem = document.getElementById('rem'), go = document.getElementById('go'), msg = document.getElementById('msg');
  const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const tob64 = u => { let s = ''; u.forEach(b => { s += String.fromCharCode(b); }); return btoa(s); };
  const open = async (key, bytes) => S.decrypt({ name: 'AES-GCM', iv: bytes.slice(0, 12) }, key, bytes.slice(12));
  const unlock = async key => JSON.parse(new TextDecoder().decode(await open(key, unb64(D.p))));
  const derive = async p => S.deriveKey(
    { name: 'PBKDF2', salt: unb64(D.s), iterations: D.i, hash: 'SHA-256' },
    await S.importKey('raw', new TextEncoder().encode(p), 'PBKDF2', false, ['deriveKey']),
    { name: 'AES-GCM', length: 256 }, true, ['decrypt']);

  const boot = (key, app) => {
    const cache = new Map();
    window.__PROD = true;
    window.__asset = p => {
      const m = app.assets[p];
      if (!m) return Promise.resolve(p);
      if (!cache.has(p)) cache.set(p, fetch(m.f)
        .then(r => { if (!r.ok) throw new Error('missing'); return r.arrayBuffer(); })
        .then(b => open(key, new Uint8Array(b)))
        .then(pt => URL.createObjectURL(new Blob([pt], { type: m.t })))
        .catch(() => p));
      return cache.get(p);
    };
    document.getElementById('gate-style').remove();
    gate.remove();
    const tpl = document.createElement('template');
    tpl.innerHTML = app.html;
    const scripts = [...tpl.content.querySelectorAll('script')];
    scripts.forEach(s => s.remove());
    document.body.prepend(tpl.content);
    scripts.forEach(s => { const n = document.createElement('script'); n.textContent = s.textContent; document.body.appendChild(n); });
  };

  if (!window.isSecureContext || !S) { gate.classList.remove('checking'); msg.textContent = 'Abre esta página con https.'; return; }

  try {
    const saved = localStorage.getItem(KEY);
    if (saved) {
      const key = await S.importKey('raw', unb64(saved), 'AES-GCM', false, ['decrypt']);
      return boot(key, await unlock(key));
    }
  } catch (e) { try { localStorage.removeItem(KEY); } catch (_) {} }

  gate.classList.remove('checking');
  pw.focus();
  let fails = 0;
  f.addEventListener('submit', async e => {
    e.preventDefault();
    if (go.disabled) return;
    go.disabled = true; msg.textContent = 'Abriendo…';
    try {
      const key = await derive(pw.value);
      const app = await unlock(key);
      if (rem.checked) { try { localStorage.setItem(KEY, tob64(new Uint8Array(await S.exportKey('raw', key)))); } catch (_) {} }
      boot(key, app);
    } catch (err) {
      fails++;
      const wait = Math.min(60, 2 ** fails);
      pw.value = '';
      msg.textContent = `Contraseña incorrecta. Espera ${wait} s.`;
      setTimeout(() => { go.disabled = false; msg.textContent = 'Contraseña incorrecta.'; pw.focus(); }, wait * 1000);
    }
  });
})();
</script>
</body>
